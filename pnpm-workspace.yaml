allowBuilds:
  esbuild: false
  sharp: false
  spawn-sync: false

# TODO: Remove once https://github.com/wxt-dev/wxt/pull/2520 is released.
overrides:
  "@wxt-dev/auto-icons>sharp": 0.35.3

peerDependencyRules:
  allowedVersions:
    # Rolldown's optional WASI binding pins @emnapi 1.11.2, while
    # @napi-rs/wasm-runtime declares @emnapi 2.0 alpha peers.
    "@napi-rs/wasm-runtime>@emnapi/core": "1.11.2"
    "@napi-rs/wasm-runtime>@emnapi/runtime": "1.11.2"

    # Oxlint loads eslint-plugin-solid for rule definitions only; this project
    # does not use the transitive @typescript-eslint parser or TypeScript API.
    "@typescript-eslint/project-service>typescript": "7"
    "@typescript-eslint/tsconfig-utils>typescript": "7"
    "@typescript-eslint/typescript-estree>typescript": "7"
    "@typescript-eslint/utils>typescript": "7"
